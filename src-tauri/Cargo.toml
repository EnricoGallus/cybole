[package]
name = "cybole"
version = "0.2.2"
description = "An editor for cybol projects"
authors = ["Enrico Gallus"]
license = ""
repository = "https://github.com/EnricoGallus/cybole"
default-run = "cybole"
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-persisted-scope = "2.4.2"
sentry = "0.49.3"
tauri-plugin-sentry = "0.8.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
